<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="256" cy="230" r="180" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.15" />
  <circle cx="256" cy="230" r="150" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.25" />

  <!-- Musical Notes floating -->
  <g fill="url(#glowGrad)" filter="url(#glow)" opacity="0.9">
    <!-- Note 1 -->
    <path d="M 370 120 L 420 105 L 420 155 C 413 151 403 150 393 153 C 375 158 365 174 371 189 C 377 204 397 212 415 207 C 429 203 438 191 438 178 L 438 100 L 370 120 Z" />
    <!-- Note 2 -->
    <path d="M 120 180 L 155 170 L 155 205 C 150 202 142 201 135 203 C 122 207 114 219 118 230 C 122 241 137 247 150 243 C 160 240 167 231 167 220 L 167 165 L 120 180 Z" opacity="0.75" />
  </g>

  <!-- Microphone Icon -->
  <g transform="translate(14, 0)">
    <!-- Mic Body & Capsule -->
    <rect x="210" y="110" width="76" height="150" rx="38" fill="url(#micGrad)" filter="url(#glow)" />
    
    <!-- Capsule Mesh Lines -->
    <line x1="210" y1="160" x2="286" y2="160" stroke="#ffffff" stroke-width="4" opacity="0.4" />
    <line x1="210" y1="185" x2="286" y2="185" stroke="#ffffff" stroke-width="4" opacity="0.4" />
    <line x1="248" y1="110" x2="248" y2="210" stroke="#ffffff" stroke-width="4" opacity="0.4" />

    <!-- Mic Cradle / Stand U-shape -->
    <path d="M 172 200 C 172 290 324 290 324 200" fill="none" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round" />
    
    <!-- Mic Stem -->
    <line x1="248" y1="285" x2="248" y2="365" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round" />
    
    <!-- Mic Base -->
    <line x1="185" y1="365" x2="311" y2="365" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round" />
    
    <!-- Sound Waves / Resonance arcs -->
    <path d="M 140 160 A 130 130 0 0 0 140 260" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M 356 160 A 130 130 0 0 1 356 260" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M 110 130 A 170 170 0 0 0 110 290" fill="none" stroke="#818cf8" stroke-width="6" stroke-linecap="round" opacity="0.5" />
    <path d="M 386 130 A 170 170 0 0 1 386 290" fill="none" stroke="#818cf8" stroke-width="6" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Star sparks -->
  <polygon points="340,320 345,335 360,340 345,345 340,360 335,345 320,340 335,335" fill="#facc15" />
  <polygon points="170,120 173,130 183,133 173,136 170,146 167,136 157,133 167,130" fill="#facc15" opacity="0.8" />
</svg>
